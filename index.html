<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="みらいくん">
<title>みらいくん</title><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-180.png"><link rel="manifest" href="manifest.json"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#030a16">
<style>
:root{--bg:#030a16;--c:#4fe3ff;--c2:#1b8fd6;--g:#c9a44c;--t:#d7ecff;--m:#7f9cc0;--p:rgba(8,26,52,.72);--b:rgba(79,227,255,.28)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{background:#030a16}html,body{margin:0;min-height:100%}
body{background:radial-gradient(ellipse at 50% 20%,#0c2446 0%,#06142a 50%,var(--bg) 100%);background-attachment:fixed;color:var(--t);font-family:-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif;padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 96px)}
.grid{position:fixed;inset:0;background-image:linear-gradient(rgba(79,227,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(79,227,255,.05) 1px,transparent 1px);background-size:36px 36px;pointer-events:none;z-index:0}
main{position:relative;z-index:1;max-width:560px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.brand{letter-spacing:.3em;color:var(--c);font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);animation:blink 2s infinite}@keyframes blink{50%{opacity:.25}}
.clock{text-align:right;font-variant-numeric:tabular-nums}.clock b{display:block;color:var(--c);font-size:20px;letter-spacing:.08em;font-weight:500}.clock small{color:var(--m);font-size:11px}
.core{position:relative;width:210px;height:210px;margin:6px auto 0}
.ring{position:absolute;inset:0;width:100%;height:100%;fill:none}.ring circle{stroke:var(--c);stroke-width:1.2}
.r1{animation:spin 26s linear infinite}.r1 circle{stroke-dasharray:3 9;opacity:.8}
.r2{inset:8%;width:84%;height:84%;animation:spin 16s linear infinite reverse}.r2 circle{stroke-dasharray:120 40 20 40;stroke-width:2;opacity:.55}
.r3{inset:-6%;width:112%;height:112%;animation:spin 40s linear infinite}.r3 circle{stroke:var(--g);stroke-dasharray:1 14;stroke-width:3;opacity:.7}
@keyframes spin{to{transform:rotate(360deg)}}
.halo{position:absolute;inset:14%;border-radius:50%;background:radial-gradient(circle,rgba(79,227,255,.35),transparent 70%);animation:breathe 3s ease-in-out infinite}@keyframes breathe{50%{transform:scale(1.08);opacity:.55}}
.peng{position:absolute;left:50%;top:50%;width:70%;transform:translate(-50%,-52%);animation:bob 3.2s ease-in-out infinite;filter:drop-shadow(0 6px 14px rgba(0,0,0,.45))}
@keyframes bob{50%{transform:translate(-50%,-56%) rotate(-2deg)}}
.think .r2 circle{stroke:var(--g)}.think .r2{animation-duration:3s}.speak .halo{animation-duration:.7s;background:radial-gradient(circle,rgba(79,227,255,.6),transparent 70%)}.speak .peng{animation-duration:.6s}
.say{min-height:3.2em;margin:10px 4px 14px;text-align:center;font-size:16px;line-height:1.65;color:#eaf6ff;text-shadow:0 0 10px rgba(79,227,255,.3);white-space:pre-wrap;word-break:break-word}
.say.long{text-align:left;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:-4px 0 14px}
.chip{border:1px solid var(--c2);color:var(--c);background:rgba(8,26,52,.8);padding:8px 12px;border-radius:18px;font-size:14px}
.chip.ok{background:linear-gradient(180deg,#1b8fd6,#0f5f9c);color:#fff;border-color:var(--c)}
.panel{background:var(--p);border:1px solid var(--b);padding:14px 16px;margin-bottom:12px;position:relative;clip-path:polygon(0 12px,12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%)}
.panel::before{content:"";position:absolute;left:0;top:0;width:54px;height:2px;background:var(--c);box-shadow:0 0 10px var(--c)}
h2{font-size:11px;letter-spacing:.28em;color:var(--m);margin:0 0 10px;font-weight:600;display:flex;align-items:center;gap:8px}h2 i{font-style:normal;color:var(--c);border:1px solid var(--b);padding:0 5px;font-size:10px}
.ev{display:flex;gap:12px;padding:7px 0;border-bottom:1px solid rgba(79,227,255,.1);font-size:14px}.ev:last-child{border:0}.ev b{color:var(--c);font-weight:500;min-width:84px;font-variant-numeric:tabular-nums}.ev.off{opacity:.45;text-decoration:line-through}
.day{color:var(--g);font-size:12px;letter-spacing:.2em;margin:8px 0 2px}
.wx{display:flex;gap:10px}.wx div{flex:1;text-align:center;border:1px solid rgba(79,227,255,.15);padding:8px 4px;font-size:13px}.wx b{display:block;color:var(--c);font-size:18px;font-weight:500}
.fit{font-size:14px;line-height:1.6}.pics{display:flex;gap:8px;overflow-x:auto;margin-top:8px}.pics img{width:92px;height:92px;object-fit:cover;background:#fff;border:1px solid var(--b)}
.closet{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.closet figure{margin:0;font-size:11px;color:var(--m);text-align:center}.closet img{width:100%;aspect-ratio:1;object-fit:cover;background:#fff;border:1px solid var(--b)}
.min a{display:block;color:var(--t);text-decoration:none;padding:7px 0;border-bottom:1px solid rgba(79,227,255,.1);font-size:14px}
.muted{color:var(--m);font-size:13px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);background:linear-gradient(180deg,rgba(3,10,22,0),rgba(3,10,22,.96) 30%)}
.bar form{max-width:560px;margin:0 auto;display:flex;gap:8px}
.bar input{flex:1;background:rgba(2,10,22,.92);color:var(--t);border:1px solid var(--b);padding:13px 14px;font-size:16px;border-radius:24px;outline:none}
.bar input:focus{border-color:var(--c)}
.bar button{width:50px;border-radius:50%;border:1px solid var(--c);background:linear-gradient(180deg,#1b8fd6,#0f5f9c);color:#fff;font-size:20px}
.bar button.snd{background:rgba(8,26,52,.9);color:var(--c);font-size:16px}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1;background:rgba(8,26,52,.7);color:var(--m);border:1px solid var(--b);padding:9px;font-size:13px;letter-spacing:.1em}.tabs button.on{color:var(--c);border-color:var(--c);box-shadow:0 0 10px rgba(79,227,255,.25)}
</style></head><body>

function speak(t){if(!voice||!window.speechSynthesis)return;try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(String(t).replace(/https?:\/\/\S+/g,'').replace(/[#*｜|]/g,'').slice(0,400));u.lang='ja-JP';u.rate=1.08;u.onstart=function(){state('speak')};u.onend=function(){state('')};speechSynthesis.speak(u)}catch(e){}}
function show(t){var s=$('say');s.textContent=t;s.className='say'+(t.length>70?' long':'');var c=$('chips');c.innerHTML='';
  var m=t.match(/[①②③④⑤⑥⑦⑧⑨]/g)||[];m.filter(function(x,i){return m.indexOf(x)===i}).slice(0,6).forEach(function(x){var b=document.createElement('button');b.className='chip';b.textContent=x+'で';b.onclick=function(){ask(x+'で')};c.appendChild(b)});
  if(/よろしいですか|よいですか|いいですか|送ってよい|登録してよい/.test(t)){[['はい、お願い','ok'],['やめる','']].forEach(function(a){var b=document.createElement('button');b.className='chip '+a[1];b.textContent=a[0];b.onclick=function(){ask(a[0])};c.appendChild(b)})}}
function ask(t){t=String(t||'').trim();if(!t)return;$('q').value='';show('「'+t+'」\n考えています…');state('think');
  api('ask',{text:t,mode:'app'}).then(function(j){state('');show(j.answer||'…');speak(j.answer||'');if(/予定|服|登録/.test(t))home()}).catch(function(){state('');show('つながりませんでした。電波を確認して、もう一度どうぞ。')})}
$('f').onsubmit=function(e){e.preventDefault();ask($('q').value)};
$('snd').onclick=function(){voice=!voice;this.textContent=voice?'🔊':'🔇';if(!voice&&window.speechSynthesis)speechSynthesis.cancel()};
function evRows(list){return list.length?list.map(function(e){return '<div class="ev'+(e.off?' off':'')+'"><b>'+esc(e.time)+'</b><span>'+esc(e.title)+(e.location?' <span class="muted">／'+esc(e.location)+'</span>':'')+'</span></div>'}).join(''):'<div class="muted">予定はありません</div>'}
function home(){api('app.home').then(function(j){if(j.error){show(j.error);return}
  if(!loaded.home){show(j.greeting);loaded.home=1}
  $('ev').innerHTML='<div class="day">今日</div>'+evRows(j.today||[])+'<div class="day">明日</div>'+evRows(j.tomorrow||[]);
  $('wx').innerHTML=(j.weather||[]).map(function(w,i){return '<div>'+(i?'明日':'今日')+'<b>'+esc(w.weather)+'</b>'+esc(w.max)+'° / '+esc(w.min)+'°<br><span class="muted">☔'+esc(w.rain_percent)+'%</span></div>'}).join('');
  $('fit').textContent=j.outfit||'まだ明日の服の提案はありません（毎晩19:45ごろに届きます）';$('fit').className='fit'+(j.outfit?'':' muted');
  $('fitpics').innerHTML=(j.outfit_images||[]).map(function(u){return '<img src="'+esc(u)+'">'}).join('')}).catch(function(){show('つながりませんでした。電波を確認してください。')})}
function closet(){api('app.closet').then(function(j){$('cl').innerHTML=(j.items||[]).map(function(x){return '<figure>'+(x.img?'<img loading="lazy" src="'+esc(x.img)+'">':'')+'<figcaption>'+esc(x.name)+(x.brand?'<br>'+esc(x.brand):'')+'</figcaption></figure>'}).join('')||'<span class="muted">まだ服が登録されていません</span>'})}
function minutes(){api('app.minutes').then(function(j){$('mn').innerHTML=(j.minutes||[]).map(function(m){return '<a href="'+esc(m.url)+'" target="_blank">📝 '+esc(m.name)+'</a>'}).join('')||'<span class="muted">まだ議事録はありません</span>'})}
document.querySelectorAll('.tabs button').forEach(function(b){b.onclick=function(){document.querySelectorAll('.tabs button').forEach(function(x){x.classList.toggle('on',x===b)});['home','closet','min'].forEach(function(id){$(id).hidden=id!==b.dataset.t});if(b.dataset.t==='closet'&&!loaded.cl){loaded.cl=1;closet()}if(b.dataset.t==='min'&&!loaded.mn){loaded.mn=1;minutes()}}});
if(!K){show('合言葉がありません。LINEのみらいくんに「スマホの設定」と送って、届いたリンクから開いてください。')}else{home();setInterval(home,300000);}
</script></body></html>
