<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="みらいくん">
<title>みらいくん</title><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-180.png"><link rel="manifest" href="manifest.json"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#030a16">
<style>html,body{margin:0;min-height:100%;background:#030a16}body{color:#7f9cc0;font:15px -apple-system,"Hiragino Sans",sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;box-sizing:border-box;text-align:center}.launch{max-width:380px}.launch a{display:inline-block;margin-top:18px;padding:11px 18px;border:1px solid #4fe3ff;border-radius:8px;color:#4fe3ff;text-decoration:none}.launch a:focus-visible{outline:2px solid #fff;outline-offset:3px}</style>
</head><body><div class="launch"><div id="s">みらいくん起動中…</div><a href="https://hipserver-production.up.railway.app/app">共通ID版を開く</a></div>
<script>
// みらいくんアプリの入口。画面そのものは毎回みらいくん（頭脳）から最新のものを読むので、このファイルは更新不要です。
(function(){
  var D='https://script.google.com/macros/s/AKfycbwBv2enMS5voXIBrqbJGgeIDHoH3VXkJspIf4SZJOB5VtjL_WXmmZ03cq8WShxG0oL-ng/exec', G=/^https:\/\/script\.google\.com\//;
  function g(k){try{return localStorage.getItem(k)||''}catch(e){return ''}} function st(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  var q=new URLSearchParams(location.search), k=q.get('k')||g('mk'), u=q.get('u')||g('mu');
  if(q.get('k'))st('mk',q.get('k')); if(G.test(q.get('u')||''))st('mu',q.get('u')); if(!G.test(u))u=D;
  var msg=function(t){var e=document.getElementById('s');if(e)e.textContent=t}, shown=false;
  function show(h){shown=true;document.open();document.write(h);document.close()}
  if(!k){msg('合言葉がありません。LINEのみらいくんに「スマホの設定」と送って、届いたリンクから開いてください。');return}
  var cached=g('mui');
  // 画面は会社のサーバーから読む（速い）。つながらない時だけ、Googleのみらいくんから
  var S='https://mirai.hipstyle.net/exec', get=function(x){return fetch(x,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'app.ui',token:k})}).then(function(r){return r.json()})};
  var p=get(S).then(function(j){if(j&&j.html)return j;throw 0}).catch(function(){return get(u)});
  if(cached){show(cached);p.then(function(j){if(j&&j.html)st('mui',j.html)}).catch(function(){});return} // 前回の画面をすぐ出し、最新版は次に開いた時に
  p.then(function(j){if(j&&j.html){st('mui',j.html);show(j.html)}else msg((j&&j.error)||'読み込めませんでした')}).catch(function(e){msg('つながりませんでした（'+(e&&e.message||e)+'）')});
})();
</script></body></html>
